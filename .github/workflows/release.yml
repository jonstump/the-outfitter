name: Release

# Governing: SPEC-0005 REQ "Reproducible Three-Platform Release Artifacts",
# REQ "Runtime Version Parity with the Canonical Pin", issue #506.
#
# Triggered on a version tag push (v*), not on every PR — that's ci.yml's job.
# Produces Windows NSIS, macOS DMG, and Linux AppImage/deb artifacts from a
# three-platform matrix, gated on the full test suite and a Node-parity check.

on:
  push:
    tags:
      - "v*"

jobs:
  # Governing: SPEC-0005 REQ "Reproducible Three-Platform Release Artifacts".
  # The full test suite SHALL pass before any packaging job runs.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Verify package-lock.json is in sync
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json is out of sync"
            exit 1
          fi
      - name: Build the client
        run: npm run build -w client
      - name: Run the full test suite
        run: npm test

  # Governing: SPEC-0005 REQ "Runtime Version Parity with the Canonical Pin".
  # The Node major bundled in the Electron runtime SHALL match the major
  # declared in .nvmrc. CI SHALL fail when the two diverge, naming both.
  # Both values are derived at build time — the .nvmrc major is read from
  # the file (not hardcoded), and Electron's bundled Node major is read via
  # `process.versions.node` inside an Electron process.
  parity-check:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Check Electron bundled Node major matches .nvmrc
        run: |
          # Read the canonical pin from .nvmrc. The file records the LTS
          # codename (e.g. `lts/iron`), so resolve the codename to its major
          # rather than taking the file's contents verbatim. Iron = 20.
          NVMRC_MAJOR=$(node -e "
            const fs = require('fs');
            const raw = fs.readFileSync('.nvmrc', 'utf8').trim();
            const codenameMap = { 'lts/iron': 20, 'lts/jod': 22 };
            const major = codenameMap[raw] || (raw.match(/^\d+$/) ? parseInt(raw, 10) : null);
            if (major === null) {
              console.error('Could not resolve .nvmrc to a Node major: ' + raw);
              process.exit(1);
            }
            process.stdout.write(String(major));
          ")
          echo ".nvmrc resolves to Node major: $NVMRC_MAJOR"

          # Read Electron's bundled Node major via process.versions.node.
          #
          # Fixed 2026-08-19 (/sdd:review on PR #508): the original command ran
          # Electron's normal GUI runtime with `--no-sandbox` and no display
          # server (Xvfb) and no ELECTRON_RUN_AS_NODE — on ubuntu-latest that
          # fails to initialize essentially every time, silently falling
          # through (empty stdout on the primary command, its "fallback"
          # branch only logged to stderr) to a SECOND fallback: a hardcoded
          # `{ '33': 20, '34': 22 }` Electron-major -> Node-major map. That is
          # exactly the hardcoded-literal comparison this requirement
          # forbids, and it was the path actually taken, not a rare edge case.
          #
          # ELECTRON_RUN_AS_NODE=1 makes the Electron binary behave as a plain
          # Node.js executable instead of launching its GUI shell — this is a
          # documented Electron feature specifically for headless CI
          # introspection like this, and needs no display server or sandbox
          # flag. With it, the direct `process.versions.node` read actually
          # runs, so no hardcoded fallback map is needed at all.
          ELECTRON_NODE_MAJOR=$(ELECTRON_RUN_AS_NODE=1 npx electron -e "
            process.stdout.write(String(process.versions.node).split('.')[0])
          ")
          if [ -z "$ELECTRON_NODE_MAJOR" ]; then
            echo "::error::Could not introspect Electron's bundled Node major via ELECTRON_RUN_AS_NODE=1. This must derive the value at build time — it MUST NOT fall back to a hardcoded Electron-major-to-Node-major table."
            exit 1
          fi
          echo "Electron bundles Node major: $ELECTRON_NODE_MAJOR"

          if [ "$ELECTRON_NODE_MAJOR" != "$NVMRC_MAJOR" ]; then
            echo "::error::Node major mismatch: Electron bundles Node $ELECTRON_NODE_MAJOR, but .nvmrc pins $NVMRC_MAJOR. Upgrade or downgrade the electron devDependency so its bundled Node major matches."
            exit 1
          fi
          echo "Node parity confirmed: both are $NVMRC_MAJOR"

  # Governing: SPEC-0005 REQ "Reproducible Three-Platform Release Artifacts".
  # Three-platform matrix producing NSIS (Windows), DMG (macOS), and
  # AppImage + deb (Linux). Every artifact is built from client/dist as
  # produced by the existing `npm run build -w client`; the desktop target
  # MUST NOT introduce a desktop-specific client build configuration.
  package:
    needs: parity-check
    strategy:
      fail-fast: true
      matrix:
        os: [windows-latest, macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Build the client
        run: npm run build -w client
      - name: Check signing credential completeness
        id: signing-check
        # Governing: SPEC-0005 REQ "Reproducible Three-Platform Release
        # Artifacts": "A release designated signed SHALL fail if its
        # credentials are unavailable. It MUST NOT fall back to emitting
        # unsigned artifacts."
        #
        # Fixed 2026-08-19 (/sdd:review on PR #508 found the incompleteness;
        # the first real tag push then found THIS): the completeness check
        # previously lived directly in the next step's `if:` as
        # `secrets.CSC_LINK == '' || ...`. That passed a plain YAML parse
        # (python's yaml.safe_load, which is all that was checked before
        # this) but fails GitHub Actions' own workflow-schema validation —
        # "Unrecognized named-value: 'secrets'" — because ci.yml is the only
        # workflow that runs on every PR, and this file only triggers on a
        # tag push, so nothing ever actually validated it as a runnable
        # workflow until the first real release. `secrets` context is not a
        # supported named-value inside a step `if:` expression here; the
        # supported pattern is to read secrets through `env:` (the one
        # channel GitHub Actions masks and scopes them for) in a `run:` step,
        # then expose the result as a step output for a later `if:` to read.
        run: |
          incomplete=false
          if [ "$RELEASE_SIGNING" = "signed" ]; then
            if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$WINDOWS_CERT_FILE" ] || [ -z "$WINDOWS_CERT_PASSWORD" ]; then
              incomplete=true
            fi
          fi
          echo "incomplete=$incomplete" >> "$GITHUB_OUTPUT"
        env:
          RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING || 'unsigned' }}
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD }}
      - name: Fail loudly if signing was requested but credentials are incomplete
        if: steps.signing-check.outputs.incomplete == 'true'
        run: |
          echo "::error::This release was designated 'signed' but one or more signing credentials are not configured (checked: CSC_LINK, CSC_KEY_PASSWORD, APPLE_ID, APPLE_APP_SPECIFIC_PASSWORD, WINDOWS_CERT_FILE, WINDOWS_CERT_PASSWORD). A signed release MUST NOT fall back to emitting unsigned artifacts."
          exit 1
      - name: Package the desktop app
        run: npm run build -w desktop
        env:
          # Every release SHALL be designated either unsigned or signed,
          # explicit in the release configuration — not inferred from whether
          # credentials happened to be present. This workflow defaults to
          # unsigned; a signed release is triggered by setting
          # RELEASE_SIGNING=signed as a repository variable. The credential
          # completeness check above already ran and would have failed the
          # job before this step if signing was requested but incomplete.
          RELEASE_SIGNING: ${{ vars.RELEASE_SIGNING || 'unsigned' }}
          # macOS signing credentials (only used when RELEASE_SIGNING=signed).
          # Out of scope for this repo — the conditional pipeline logic is
          # real, but no secrets are configured yet.
          CSC_LINK: ${{ secrets.CSC_LINK || '' }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD || '' }}
          APPLE_ID: ${{ secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          # Windows Authenticode signing (only used when RELEASE_SIGNING=signed).
          WINDOWS_CERT_FILE: ${{ secrets.WINDOWS_CERT_FILE || '' }}
          WINDOWS_CERT_PASSWORD: ${{ secrets.WINDOWS_CERT_PASSWORD || '' }}
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: desktop/dist-electron/*
