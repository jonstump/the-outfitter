name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Governing: ADR-0004, SPEC-0002 REQ "Canonical Node Version Pin".
      # .nvmrc is the single canonical pin — resolve from it rather than
      # hardcoding a literal, so bumping the Node major is a one-file change.
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Governing: ADR-0004, SPEC-0002 REQ "Lockfile Integrity Verification".
      # `npm ci` already refuses to install when package.json and the lockfile
      # disagree on dependency ranges, but it cannot see root-manifest metadata
      # drift: npm records fields like `engines` in the lock's "" entry, and that
      # copy went stale unnoticed until 1fbd2b1. Regenerating the lock from the
      # manifests and diffing catches both classes on the PR that introduced them.
      # --package-lock-only leaves node_modules alone, so the install above still
      # serves the build and test steps below.
      - name: Verify package-lock.json is in sync with the manifests
        run: |
          npm install --package-lock-only --ignore-scripts
          if ! git diff --exit-code -- package-lock.json; then
            echo "::error file=package-lock.json::package-lock.json is out of sync with the manifests. Run 'npm install --package-lock-only' locally and commit the result."
            exit 1
          fi

      - name: Build the client
        run: npm run build -w client

      # Governing: SPEC-0002 REQ "Task Interface Stability".
      # One command, the same one the README documents and a contributor runs.
      # It previously ran the client and scrape suites step-by-step and simply
      # omitted the server's — 48 tests, including the cross-token ownership
      # assertions ADR-0006 calls the rule "most likely to be missed" (issue
      # #118). Fanning out from a single root script means adding a workspace
      # cannot leave CI silently behind again.
      - name: Run the test suites
        run: npm test

  # Governing: ADR-0006, ADR-0007, SPEC-0003 REQ "Favorite Hunters".
  # Every suite above runs against the REPO TREE. The container runs against a different
  # filesystem — a multi-stage build discards the build stage, so anything the Dockerfile
  # does not COPY is simply absent. That gap shipped a favorites feature that returned 400
  # on every write in the image while 275 client and 63 server tests stayed green and
  # /healthz stayed 200 (PR #133 review). Nothing but exercising the packaged layout can
  # see it, so this job builds the image, boots it, and drives one real favorite through.
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # No registry push and no cross-platform matrix — plain `docker build` on the runner's
      # own daemon is the cheapest thing that produces the artifact under test.
      - name: Build the image
        run: docker build -t outfitter:ci .

      - name: Run the container
        run: |
          docker run -d --name outfitter-ci -p 4100:4100 outfitter:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:4100/healthz >/dev/null 2>&1; then
              echo "healthy after ${i}s"; exit 0
            fi
            sleep 1
          done
          echo "::error::the container never became healthy"
          docker logs outfitter-ci
          exit 1

      # The actual regression test. A favorite is the one endpoint that reads a data file
      # the runtime stage has to have been told to copy, so a 400 here means the image is
      # mis-packaged even though the build succeeded.
      - name: A favorite must round-trip against the packaged image
        run: |
          TOKEN=$(cat /proc/sys/kernel/random/uuid)
          code=$(curl -s -o /tmp/put.json -w '%{http_code}' -X PUT \
            -H "x-loadout-token: $TOKEN" \
            http://localhost:4100/api/hunter-favorites/the-rat)
          if [ "$code" != "201" ]; then
            echo "::error::PUT /api/hunter-favorites/the-rat returned $code, expected 201"
            cat /tmp/put.json; echo
            docker logs outfitter-ci
            exit 1
          fi
          # And it is readable back, so the write reached the store rather than just
          # answering 201.
          curl -fsS -H "x-loadout-token: $TOKEN" http://localhost:4100/api/hunter-favorites \
            | grep -q 'the-rat' || {
              echo "::error::the favorite did not come back from GET /api/hunter-favorites"
              docker logs outfitter-ci
              exit 1
            }
          echo "favorite round-tripped against the image"

      - name: Container logs
        if: always()
        run: docker logs outfitter-ci || true

  # Governing: ADR-0004 (Confirmation), SPEC-0002 REQ "Toolchain Enforcement at Install Time".
  # `engine-strict=true` in .npmrc is what turns a wrong Node major into a failed install
  # rather than a warning nobody reads — but nothing proved it actually fires. This job
  # installs on a major the root `engines.node` range excludes and asserts npm refuses.
  # The version below is hardcoded and MUST stay outside the .nvmrc range: it is the
  # negative case, so deriving it from the canonical pin would defeat the test.
  engine-guard:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # --dry-run resolves the tree and validates engines without writing node_modules,
      # so the guard costs seconds. npm exits 1 with EBADENGINE naming the required range.
      - name: npm ci must refuse an unsupported Node major
        run: |
          if npm ci --dry-run; then
            echo "::error::npm ci succeeded on $(node -v) despite engines.node excluding it — engine-strict is not enforcing the root range"
            exit 1
          fi
          echo "npm ci correctly refused $(node -v)"
